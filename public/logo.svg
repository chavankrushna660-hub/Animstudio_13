<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background red gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83535" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#C51F1F" />
    </linearGradient>

    <!-- Subtle texture noise/radial lighting -->
    <radialGradient id="lightGlow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </radialGradient>

    <!-- Soft drop shadow for 3D letter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#550505" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#400000" flood-opacity="0.8" />
    </filter>

    <!-- Bevel / 3D emboss gradient for white 'A' -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F4F4F6" />
      <stop offset="100%" stop-color="#E2E3E8" />
    </linearGradient>
  </defs>

  <!-- Base red rounded container (Launcher squircle) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="108" fill="url(#lightGlow)" />

  <!-- Subtle inner border rim -->
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="#FFA3A3" stroke-width="2" stroke-opacity="0.25" />

  <!-- Letter A: 3D Relief & Exact Letterform Shape -->
  <g filter="url(#softShadow)">
    <path fill="url(#bevelGrad)" stroke="#B81A1A" stroke-width="4" stroke-linejoin="round" fill-rule="evenodd" d="
      M 194 92
      C 194 80, 208 72, 224 72
      L 288 72
      C 304 72, 318 80, 318 92
      L 426 394
      C 434 414, 418 430, 396 430
      L 330 430
      C 314 430, 302 418, 296 402
      L 278 348
      C 270 354, 242 354, 234 348
      L 216 402
      C 210 418, 198 430, 182 430
      L 116 430
      C 94 430, 78 414, 86 394
      L 194 92 Z

      M 238 290
      L 274 290
      C 276 280, 260 148, 256 140
      C 252 148, 236 280, 238 290 Z
    " />
  </g>
</svg>